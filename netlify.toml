# Netlify config (added v0.24.0 for the leaderboard function).
# The game is a static single-file site — no build command. Netlify still
# runs `npm install` because package.json exists, which fetches the
# leaderboard function's @netlify/blobs dependency.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# v0.28.0 — Play Store Phase C. Android's Digital Asset Links verifier is
# strict: assetlinks.json MUST be served as application/json (a text/plain
# or text/html content-type silently fails domain verification, leaving the
# TWA with a browser URL bar). Netlify already infers this for .json, but
# pinning it explicitly removes any doubt.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
