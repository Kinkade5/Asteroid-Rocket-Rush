<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rocket Rush — Feature Graphic 1024x500</title>
<style>
  /* Play Store feature graphic source. Render with:
     chrome --headless=new --screenshot=feature-graphic-1024x500.png
            --window-size=1024,500 --hide-scrollbars feature-graphic.html
     Brand: matches index.html (.title gradient #ffd86b→#ff5a9e, bg #05060f,
     subtitle #9aa3d6) and icon-512.png rocket (white body / red band /
     cyan porthole / orange flame). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  #stage {
    position: relative;
    width: 1024px;
    height: 500px;
    background:
      radial-gradient(620px 420px at 18% 28%, rgba(255, 90, 158, 0.10), transparent 70%),
      radial-gradient(700px 480px at 88% 82%, rgba(106, 240, 255, 0.07), transparent 70%),
      radial-gradient(900px 600px at 75% 20%, rgba(64, 48, 140, 0.22), transparent 72%),
      linear-gradient(160deg, #0a0c1e 0%, #05060f 55%, #070818 100%);
    font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
  }
  #art { position: absolute; inset: 0; }
  .text {
    position: absolute;
    left: 66px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .title {
    font-size: 108px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #ffd86b 0%, #ff5a9e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 120, 180, 0.28));
  }
  .tagline {
    margin-top: 22px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 7px;
    color: #9aa3d6;
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#d8dcf0"/>
      </linearGradient>
      <linearGradient id="finG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6d8d"/>
        <stop offset="1" stop-color="#e03a60"/>
      </linearGradient>
      <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb84d"/>
        <stop offset="1" stop-color="#ff5f2e"/>
      </linearGradient>
      <linearGradient id="flameInnerG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff3c4"/>
        <stop offset="1" stop-color="#ffd86b"/>
      </linearGradient>
      <radialGradient id="goldG" cx="0.35" cy="0.3" r="1">
        <stop offset="0" stop-color="#ffe9a3"/>
        <stop offset="1" stop-color="#eaa92f"/>
      </radialGradient>
      <radialGradient id="silverG" cx="0.35" cy="0.3" r="1">
        <stop offset="0" stop-color="#f4f7ff"/>
        <stop offset="1" stop-color="#9fa9c2"/>
      </radialGradient>
      <radialGradient id="bronzeG" cx="0.35" cy="0.3" r="1">
        <stop offset="0" stop-color="#f2b98a"/>
        <stop offset="1" stop-color="#a15f30"/>
      </radialGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- starfield (seeded, filled by script) -->
    <g id="stars"></g>

    <!-- asteroids -->
    <g transform="translate(676, 78) rotate(-14)">
      <path d="M -40 -6 L -26 -30 L 2 -37 L 30 -24 L 39 2 L 26 28 L -4 35 L -32 22 Z"
            fill="#4a4f68" stroke="#343850" stroke-width="3"/>
      <circle cx="-12" cy="-8" r="8" fill="#3b3f58"/>
      <circle cx="14" cy="10" r="5.5" fill="#3b3f58"/>
      <circle cx="8" cy="-16" r="3.5" fill="#40445e"/>
    </g>
    <g transform="translate(986, 404) rotate(24)">
      <path d="M -58 -10 L -36 -44 L 4 -54 L 44 -34 L 57 2 L 38 42 L -6 52 L -46 32 Z"
            fill="#515670" stroke="#383c56" stroke-width="4"/>
      <circle cx="-18" cy="-12" r="12" fill="#404459"/>
      <circle cx="20" cy="14" r="8" fill="#404459"/>
      <circle cx="12" cy="-26" r="5" fill="#464a64"/>
    </g>
    <g transform="translate(560, 452) rotate(-30)">
      <path d="M -24 -4 L -15 -18 L 2 -22 L 18 -14 L 23 1 L 15 17 L -3 21 L -19 13 Z"
            fill="#454a62" stroke="#31354c" stroke-width="2.5"/>
      <circle cx="-6" cy="-4" r="5" fill="#383c54"/>
    </g>

    <!-- coin trail arcing toward the rocket -->
    <g filter="url(#softGlow)">
      <g transform="translate(556, 330)"><circle r="13" fill="url(#bronzeG)"/><circle r="7.5" fill="none" stroke="#8a4f26" stroke-width="2.5"/></g>
      <g transform="translate(610, 282)"><circle r="14" fill="url(#silverG)"/><circle r="8" fill="none" stroke="#7e88a2" stroke-width="2.5"/></g>
      <g transform="translate(662, 240)"><circle r="16" fill="url(#goldG)"/><circle r="9" fill="none" stroke="#c8901e" stroke-width="3"/></g>
      <g transform="translate(712, 206)"><circle r="14" fill="url(#goldG)"/><circle r="8" fill="none" stroke="#c8901e" stroke-width="2.5"/></g>
    </g>

    <!-- rocket -->
    <g transform="translate(830, 250) rotate(20) scale(1.22)">
      <!-- flame -->
      <g filter="url(#glow)">
        <path d="M -15 104 Q 0 128 15 104 Q 10 158 0 186 Q -10 158 -15 104 Z" fill="url(#flameG)"/>
        <path d="M -8 104 Q 0 120 8 104 Q 5 138 0 156 Q -5 138 -8 104 Z" fill="url(#flameInnerG)"/>
      </g>
      <!-- fins -->
      <path d="M -30 22 L -63 96 L -30 74 Z" fill="url(#finG)"/>
      <path d="M 30 22 L 63 96 L 30 74 Z" fill="url(#finG)"/>
      <!-- nozzle -->
      <path d="M -15 94 L 15 94 L 10 106 L -10 106 Z" fill="#aab1cc"/>
      <!-- body -->
      <path d="M 0 -112 L 30 -46 L 30 62 L 18 94 L -18 94 L -30 62 L -30 -46 Z" fill="url(#bodyG)"/>
      <!-- red band -->
      <path d="M -30 -14 L 30 -14 L 30 16 L -30 16 Z" fill="#ff4f6b"/>
      <!-- porthole -->
      <circle cx="0" cy="-48" r="17" fill="#4de5f5"/>
      <circle cx="-5.5" cy="-53" r="5" fill="#d8fbff"/>
    </g>
  </svg>

  <div class="text">
    <div class="title">ROCKET<br>RUSH</div>
    <div class="tagline">DODGE&nbsp;•&nbsp;COLLECT&nbsp;•&nbsp;SURVIVE</div>
  </div>
</div>

<script>
  // Deterministic starfield so every re-render is identical.
  (function () {
    let seed = 1337;
    function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
    const g = document.getElementById('stars');
    const NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < 110; i++) {
      const c = document.createElementNS(NS, 'circle');
      const x = rnd() * 1024, y = rnd() * 500;
      // keep big stars from cluttering the title block
      const overText = x < 520 && y > 110 && y < 400;
      const r = (overText ? 0.8 : 1.0) * (0.7 + rnd() * 1.9);
      c.setAttribute('cx', x.toFixed(1));
      c.setAttribute('cy', y.toFixed(1));
      c.setAttribute('r', r.toFixed(2));
      const tint = rnd();
      c.setAttribute('fill', tint < 0.72 ? '#c9d0f2' : (tint < 0.88 ? '#6af0ff' : '#ffd86b'));
      c.setAttribute('opacity', (0.25 + rnd() * 0.6).toFixed(2));
      g.appendChild(c);
    }
  })();
</script>
</body>
</html>
